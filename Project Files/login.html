<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – EV Analytics Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-container">
    <form class="login-form">
      <h1>Login</h1>
      <p class="subtitle">EV Analytics Dashboard</p>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="student@example.com" />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" />

      <button type="button" class="btn-primary">Login</button>

      <p class="footer-note">
        Demo login page – no backend connected
      </p>
    </form>
  </div>
</body>
</html>
